kind = "web"
previewPath = "/"
title = "ZouZou & Friends"
description = "A playful one-page cat logic puzzle game with daily and endless modes, difficulty selection, lives, timers, and locally saved best times."
version = "1.0.0"
id = "artifacts/zouzou-friends"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23075

[services.development]
run = "pnpm --filter @workspace/zouzou-friends run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zouzou-friends", "run", "build" ]
serve = "static"
publicDir = "artifacts/zouzou-friends/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23075"
BASE_PATH = "/"
